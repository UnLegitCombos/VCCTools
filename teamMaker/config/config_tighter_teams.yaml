# Tighter-teams profile. Not meant to be used on its own: extend it from a
# local config.yaml, or run it directly (it extends the documented example).
#
#   # config.yaml
#   extends: config_tighter_teams.yaml
#   random_seed: 12
#
# Only the values that differ from config.example.yaml are listed here.
extends: config.example.yaml

peak_act_max_act: 2            # count Episode peaks up to E8A2 for the peak-act bonus

random_seed: 12                # fixed seed for reproducible runs

optimizer:
  restarts: 10
  time_limit_s: 300
  target_range: 0.05           # stop only once teams are within 0.05 of each other
  role_weight: 0.2             # favour strength balance over role fit
