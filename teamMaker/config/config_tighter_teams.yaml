# Tighter-teams profile: optimizer settings applied on top of config.yaml.
#
#   python -m teamMaker.core.build_teams --tighter
#
# Only the settings below change; everything else (scoring, seed, groups)
# comes from config.yaml. Expect slower runs for closer team totals.

optimizer:
  restarts: 10
  time_limit_s: 300
  target_range: 0.05           # stop only once teams are within 0.05 of each other
  role_weight: 0.2             # favour strength balance over role fit
